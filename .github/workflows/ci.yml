name: CI

on:
  push:
    branches: [main]
    # v*.*.* is Step 162's own (§41.1) tag-push trigger for
    # publish-control-plane-image below -- a tag, not an ordinary push to
    # main, is the one signal that promotes an image to something
    # operators pull from the GitHub Container Registry.
    tags: ["v*.*.*"]
  pull_request:

jobs:
  branch-name:
    # Enforces the <type>/<short-kebab-description> branch naming convention
    # documented in CLAUDE.md — only meaningful on pull_request events, since
    # github.head_ref is empty on push. Dependabot branches are exempt: their
    # dependabot/<ecosystem>/<dependency>-<version> scheme is fixed by the bot
    # (only the separator is configurable), and the convention targets branches
    # a human or agent names.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name follows Conventional-Commits type/kebab-description
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$BRANCH" == dependabot/* ]]; then
            echo "Branch '$BRANCH' is a Dependabot branch — exempt from the naming convention"
            exit 0
          fi
          if ! [[ "$BRANCH" =~ ^(feat|fix|docs|chore|refactor|test|perf|ci|build)/[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::Branch name '$BRANCH' doesn't follow <type>/<short-kebab-description> (see CLAUDE.md). Allowed types: feat, fix, docs, chore, refactor, test, perf, ci, build."
            exit 1
          fi
          echo "Branch name '$BRANCH' OK"

  commit-scope:
    # ADVISORY ONLY — never fails the build. CLAUDE.md defines a commit's scope
    # as "the primary package or directory touched", but that is a judgement
    # call this check cannot make reliably, so it only surfaces the one case
    # that is actively misleading rather than merely imprecise: a scope that
    # names a REAL directory in the repo which the commit touched no file
    # under. That is what makes `git log --grep='(sandbox)'` return commits
    # that never went near internal/domain/sandbox while missing the ones that
    # did (the audit finding this job exists for).
    #
    # A scope naming no directory at all (`identity`, spanning identitylink +
    # slack + linear) is deliberately SKIPPED: it is a conceptual scope, so
    # there is no package for a reader to be misled about.
    #
    # Calibrated against 150 commits of this repo's own history before being
    # added: 111 matched, 13 warned, 26 skipped. Most of those 13 are a
    # domain-concept scope used for work in a sibling package (`outbox` for
    # outboxworker, `turn` for httpapi) — defensible, which is exactly why
    # this warns instead of blocking. Treat a warning as "worth a glance",
    # never as "must change".
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check commit scopes against touched directories (advisory)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          # Every directory basename in the tree, so a scope can be tested for
          # "is this even a package name" before judging the commit.
          dirs=$(git ls-tree -rd --name-only "$HEAD" | awk -F/ '{print $NF}' | sort -u)
          warned=0

          # --no-merges: merge commits are exempt from Conventional Commits
          # per CLAUDE.md, and their subjects are generated by GitHub anyway.
          while IFS='|' read -r sha subject; do
            [ -z "$sha" ] && continue
            scope=$(printf '%s' "$subject" | sed -nE 's/^[a-z]+\(([a-z0-9_-]+)\)!?:.*/\1/p')
            [ -z "$scope" ] && continue
            printf '%s\n' "$dirs" | grep -qxF "$scope" || continue

            files=$(git show --pretty=format: --name-only "$sha" | grep -v '^$' || true)
            if ! printf '%s\n' "$files" | grep -qE "(^|/)${scope}(/|\$)"; then
              warned=$((warned + 1))
              echo "::warning::Commit $(git log -1 --format=%h "$sha") is scoped ($scope), which names a real directory, but touches no file under it — consider a scope matching the package actually changed. Advisory only; see CLAUDE.md. Subject: ${subject}"
            fi
          done < <(git log --no-merges --format='%H|%s' "$BASE..$HEAD")

          if [ "$warned" -eq 0 ]; then
            echo "All scoped commits name a directory they actually touched."
          else
            echo "$warned advisory scope warning(s) above — this job never fails the build."
          fi

  # ci runs everything that's cheap and needs no Docker: vet, both linters,
  # the plain (non-integration) unit test suite, and the contracts
  # codegen-drift/typecheck check. test-integration (below) depends on this
  # job passing before it spends any matrix-runner/Docker time, preserving
  # the previous single-job behavior where a vet/lint/test failure stopped
  # the job before integration tests or contracts-check ever ran -- it just
  # now fails a few minutes faster, since contracts-check no longer waits
  # behind test-integration's own ~30 minutes to run.
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install contracts dependencies
        run: npm ci
        working-directory: contracts

      # Step 17 (§7): installs the real OpenCode binary so the OpenCode
      # adapter's own server-only contract tests (spawning it, GET
      # /api/health, POST /session, GET /event's server.connected
      # handshake -- no AI provider call, no credential needed) run for
      # real in CI, not just on a dev machine. This CI runner has no AI
      # provider configured (no OPENAI_API_KEY/ANTHROPIC_API_KEY secret,
      # and no `opencode auth login` credential store) -- the REAL-
      # scripted-turn tests (internal/adapters/outbound/opencode's own
      # TestRealTurn_* tests) correctly detect that and skip gracefully
      # rather than fail. This is a deliberate, visible trade-off: those
      # tests only prove the SSE-translation logic against a real model
      # response on a machine that HAS a provider configured (verified on
      # a dev machine during this Step's own design phase) -- adding a
      # paid provider secret to CI is a decision left to the user, not
      # made unilaterally here (see this Step's own report/PR description
      # for the same note).
      # opencode-ai ships a `postinstall` script (node ./postinstall.mjs)
      # that does the real work of setting up a working `opencode` binary.
      # npm's newer supply-chain-security default blocks install-time
      # lifecycle scripts for packages it hasn't been told to trust ("npm
      # warn allow-scripts ... not yet covered by allowScripts") -- without
      # --allow-scripts, that postinstall silently never runs, leaving a
      # broken `opencode` on PATH and every opencode-serve-spawning test
      # (this package's own AND internal/sandboxagent/opencodeproc's)
      # failing with a health-check timeout, not a skip. `npm approve-
      # scripts` (what the warning itself suggests) does not work for
      # global installs (no project package.json to record the approval
      # against, npm/cli#9457) -- the actual fix for a one-off `-g`
      # install is the --allow-scripts=<pkg> flag.
      #
      # Needed here too (not just in test-integration below): a handful of
      # opencode/opencodeproc test files spawn a real `opencode serve`
      # process with no `integration` build-tag guard, so they also run
      # under plain `make test`.
      - name: Install OpenCode
        # Deliberate pin (§7 "Pin the OpenCode version"): bump only via a
        # dedicated future PR once a newer version has itself been validated,
        # never an automatic floating install.
        run: npm install -g --allow-scripts=opencode-ai opencode-ai@1.17.15

      - name: Vet
        run: make vet

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2

      - name: Lint (custom checks)
        run: go run ./tools/lint/narvichecks ./...

      - name: Test
        run: make test

      - name: Contracts (schema codegen drift + TS typecheck)
        run: make contracts-check

  # test-integration restores job-level parallelism for the ~30 minutes of
  # wall-clock ba24c5d's `-p 1` added, WITHOUT reintroducing the host-Docker
  # contention `-p 1` was fixing (see that commit's own Makefile doc comment
  # for the full incident history: three real CI hangs, three different
  # testcontainers-go internal call sites, one shared root cause). Each
  # group now runs as its own GITHUB ACTIONS JOB, each on its own runner
  # VM with its own, uncontended Docker daemon, so there is no cross-group
  # resource sharing the way there was when everything ran inside one
  # job/VM -- see Makefile's own comment above the test-integration-
  # group-N targets for the WITHIN-group -p value each group actually
  # runs at (verified per group, not uniform across all four).
  #
  # Groups are bin-packed by measured per-package duration (real green CI
  # run 30875940504, 2026-08-04, the merge of ba24c5d itself onto main):
  # internal/adapters/inbound/httpapi alone is ~508s -- roughly as heavy as
  # everything else in the repo COMBINED (~1270s across the other ~70
  # packages), because it spins up its own throwaway Postgres container
  # per test function (~170 of them, no reuse) -- so it gets its own group,
  # and the rest are bin-packed (longest-processing-time greedy) into three
  # more groups of ~420s each. That caps the matrix at 4 legs, each roughly
  # comparable to httpapi's own ~508s floor: adding a 5th+ leg to shave the
  # other three groups down further wouldn't shorten the matrix's overall
  # wall-clock (still bottlenecked by httpapi's own single-package ~508s),
  # it would just multiply GitHub Actions' fixed per-leg overhead (checkout
  # + Go setup + OpenCode install, ~30-45s each) for no benefit -- see this
  # PR's own description for the full timing table this was based on.
  #
  # The exact package groupings live in the Makefile (test-integration-
  # group-1..4), not here, so there's one source of truth for "which
  # packages are in which group" -- see the Makefile's own comment above
  # those targets for how group 4 (the catch-all for everything not
  # explicitly bin-packed into 1-3) is computed, so a newly added package
  # is never silently skipped.
  test-integration:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # See the "ci" job's own "Install OpenCode" step for the full
      # rationale (Step 17 §7, the --allow-scripts requirement, the pinned
      # version). Duplicated here rather than shared because each matrix
      # leg is a fully independent runner VM -- this group doesn't need
      # contracts/'s npm dependencies (that's contracts-check only, which
      # stays in the "ci" job), just the opencode binary itself for
      # whichever of groups 2/3/4 exercises the opencode/opencodeproc
      # packages.
      - name: Install OpenCode
        run: npm install -g --allow-scripts=opencode-ai opencode-ai@1.17.15

      - name: Test (integration, group ${{ matrix.group }})
        run: make test-integration-group-${{ matrix.group }}

  # sandbox-image (Step 74's own adversarial review, Finding 2, MEDIUM):
  # before this job, no workflow in this repo built deploy/sandbox-image/
  # Dockerfile at all -- the ONE artifact in this repo with zero
  # automated verification, which is exactly why Finding 1 (the image
  # could not start dockerd under ANY configuration -- the tarball
  # install list dropped docker-proxy/docker-init, and the apt list
  # shipped no iptables) landed there undetected. A lint-only check would
  # NOT have caught either half: both were RUNTIME failures (dockerd's
  # own config validation, then its bridge-driver/iptables network-
  # controller init), not syntax errors a linter can see.
  #
  # Coverage: builds the Dockerfile's own `runtime-base` stage for real
  # (debian:bookworm-slim + the apt/iptables layer + the Docker CLI/
  # engine binary layer -- see that file's own top doc comment for why
  # this is its own named stage) and runs a real `dockerd` inside it,
  # asserting it reaches a live, ready socket with the bridge network
  # driver registered -- the exact two failure points Finding 1
  # reproduced (verified against this exact job's own approach during
  # the review: builds cleanly, `dockerd` gets past config validation,
  # the bridge driver registers, `docker info`/`docker version` succeed
  # against the live daemon). `runtime-base` shares no dependency edge
  # with the `builder` stage (the Go compile) or the later `toolchain`
  # stage (ripgrep/Node/typescript-language-server/Playwright+Chromium/
  # the cloud SDKs) -- `--target=runtime-base` builds neither, so this
  # job pays for none of that.
  #
  # Gated on a path filter, computed by hand via `git diff` (mirroring
  # the commit-scope job above, rather than adding a third-party paths-
  # filter action this repo doesn't otherwise depend on) so ordinary PRs
  # that never touch deploy/sandbox-image/ pay nothing for this job
  # beyond the fixed checkout/job-startup overhead every job already
  # pays.
  #
  # NOT covered: the toolchain stage and the final image (+ the Go
  # builder stage compiling sandbox-agent itself) are untouched here -- a
  # full end-to-end image build stays a manual/local check (this Step's
  # own PR description has real output from one) until a registry/push
  # pipeline exists for this image to warrant a CI job paying Chromium's
  # own ~1GB cost on every relevant PR (out of this Step's scope, same
  # "external build service" boundary the Dockerfile's own top comment
  # already draws for the push/registry side of this same problem).
  sandbox-image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check for deploy/sandbox-image/ changes
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only "$BASE" "$HEAD" -- deploy/sandbox-image/ | grep -q .; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No changes under deploy/sandbox-image/ -- skipping the image build/smoke check."
          fi

      - name: Build runtime-base (debian-slim + apt/iptables + Docker CLI/engine)
        if: steps.changes.outputs.relevant == 'true'
        run: |
          docker build --target=runtime-base \
            -t narvi-sandbox-runtime-base:ci \
            -f deploy/sandbox-image/Dockerfile .

      - name: Smoke-check dockerd starts and becomes ready
        if: steps.changes.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          docker run -d --privileged --name sandbox-dockerd-smoke narvi-sandbox-runtime-base:ci dockerd

          ready=""
          for _ in $(seq 1 30); do
            if docker exec sandbox-dockerd-smoke test -S /var/run/docker.sock; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::dockerd never created its socket within 30s"
            docker logs sandbox-dockerd-smoke
            exit 1
          fi

          echo "-- dockerd is up; verifying it actually works, not just that its socket exists --"
          docker exec sandbox-dockerd-smoke docker version
          docker exec sandbox-dockerd-smoke docker info | tee /tmp/docker-info.txt
          grep -qE '^[[:space:]]*Network:.*\bbridge\b' /tmp/docker-info.txt || {
            echo "::error::bridge network driver did not register (the iptables failure mode Finding 1 reproduced)"
            exit 1
          }

      - name: Clean up
        if: always()
        run: |
          docker rm -f sandbox-dockerd-smoke >/dev/null 2>&1 || true
          docker rmi narvi-sandbox-runtime-base:ci >/dev/null 2>&1 || true

  # control-plane-image (§41.1, Step 162): the repository-root Dockerfile
  # is this Step's own proof obligation that "packaged as standard
  # containers" is true of the binary, not merely of the plan -- so unlike
  # sandbox-image and web above, this job is deliberately NOT gated on a
  # path filter. This Dockerfile's own top comment explains why: stage
  # one runs `make dist` itself, whose own recipe (web-build +
  # lint-web-assets + go build) already touches nearly every tracked
  # directory in this repository, so an ordinary Go or web change is
  # exactly the kind of change this job exists to catch, not one it can
  # afford to skip.
  #
  # Runs on every pull_request AND every v*.*.* tag push, not
  # pull_request alone (§41.1 review round 1, finding P6): publish-
  # control-plane-image below `needs:` this exact job, so a tag push runs
  # this Step's own exit criterion against the commit actually being
  # published, rather than trusting that SOME earlier PR once ran it
  # against an ancestor of that commit.
  #
  # Runs Makefile's own verify-control-plane-image target -- the SAME
  # script a developer runs locally (that target's own doc comment has
  # the full "why" and exactly which three exit-criterion parts it
  # checks: `docker run <image> routes` against
  # controlplane/testdata/routes.golden byte-for-byte, the image actually
  # serving real HTTP traffic against tools/ghappstub's own local GitHub
  # App stub, and an unconfigured `docker run` failing cleanly with
  # platform.Config's own validation message) -- so this job can never
  # drift from what a contributor actually ran before opening the PR. The
  # target brings up ONLY docker-compose.dev.yml's own postgres service,
  # under its own disposable compose project, and reaches it over that
  # project's own compose network -- not host.docker.internal, which a
  # 127.0.0.1-bound published port never answers from a Linux runner's
  # own docker0 bridge gateway (§41.1 review round 1, finding P4 -- this
  # is what makes this job able to pass on ubuntu-latest at all).
  control-plane-image:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build image and run this Step's own exit criterion
        run: make verify-control-plane-image

      - name: Clean up
        if: always()
        run: |
          docker rm -f narvi-control-plane-verify >/dev/null 2>&1 || true
          docker compose -f docker-compose.dev.yml -p narvi-cpverify down -v >/dev/null 2>&1 || true

  # publish-control-plane-image (§41.1, Step 162): publishes the image
  # control-plane-image above already proved boots and serves the golden
  # route table -- built again here from the SAME, unmodified Dockerfile,
  # since a tag push builds a fresh image (a different build context than
  # whatever the merging PR built) even though it's the identical
  # Dockerfile and commit.
  #
  # `needs: control-plane-image` (§41.1 review round 1, finding P6) is
  # what actually closes the gap that used to exist here: this job used to
  # run on a tag push with no guarantee the PR that landed this exact
  # commit on main ever ran control-plane-image at all (a direct push to
  # main, or a tag on an older commit, would not have) -- this workflow's
  # own on.push.tags trigger fires this SAME control-plane-image job again
  # on every tag push (see that job's own `if:` above), so `needs:` makes
  # this job wait for, and require success from, THIS job's own
  # exit-criterion run against the exact commit being tagged, not a
  # historical PR run against some ancestor of it.
  #
  # Gated on a tag push ONLY (this workflow's own top-level `on.push.tags`
  # trigger), never an ordinary push to main -- a tag is the one signal
  # that promotes an image to something operators pull from the GitHub
  # Container Registry, matching how deploy/control-plane/deployment.yaml's
  # own image placeholder names an explicit tag, never :latest.
  #
  # Labeled (this Dockerfile's own stage-2 LABEL instructions, populated
  # via --build-arg below) with the tag and the git SHA as
  # org.opencontainers.image.version/.revision -- the SAME two values
  # sandbox-agent's own boot fingerprint already logs (§5.3), so a running
  # control plane can be matched to its source.
  #
  # permissions is scoped to THIS job alone (this workflow file carries no
  # top-level permissions block, so every other job keeps the default,
  # read-only GITHUB_TOKEN) -- packages: write is the one scope this job
  # needs and no other job in this file does.
  #
  # --platform linux/amd64 (below) is explicit rather than implied by the
  # ubuntu-latest runner's own architecture -- matches
  # verify-control-plane-image's own identical pin (Makefile) and
  # deployment.yaml's own ordinary-amd64-node-pool assumption, so a future
  # runner-architecture change can never silently publish a different
  # image than the one control-plane-image already verified.
  publish-control-plane-image:
    needs: control-plane-image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to the GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        env:
          # This repository's own GHCR path under its GitHub owner (git
          # remote -v: git@github.com:narvidev/narvi.git) -- never a
          # placeholder or unrelated organization name.
          IMAGE: ghcr.io/narvidev/narvi/control-plane
          TAG: ${{ github.ref_name }}
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg NARVI_VERSION="$TAG" \
            --build-arg NARVI_REVISION="${{ github.sha }}" \
            -t "$IMAGE:$TAG" \
            -f Dockerfile .
          docker push "$IMAGE:$TAG"

  # web (§12.1, "ui bootstrap"): typecheck + lint + the generated-DTO-name
  # guard + build for web/ (Vite + React + TanStack Query/Router) -- the
  # frontend's own equivalent of the "checks" job above, over a different
  # toolchain. Gated on a path filter computed by hand via `git diff`, the
  # SAME approach (and the SAME rationale: no third-party paths-filter
  # action this repo doesn't otherwise depend on) as the sandbox-image
  # job's own filter immediately above, so a PR that never touches web/
  # pays nothing for this job beyond the fixed checkout/job-startup
  # overhead every job already pays.
  web:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check for changes this job can catch
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # contracts/ is in this list because the SPA IMPORTS from it:
          # web/src reads the generated DTOs as @narvi/contracts/rest-dtos.
          # Filtered on web/ alone, a contracts-only change that renamed or
          # removed a field broke the SPA's typecheck and this job never
          # ran -- the whole PR went green while the frontend no longer
          # compiled. A path filter has to cover what the job can BREAK,
          # not just where the job's own sources live.
          # This workflow file is here for the same reason: a change to the
          # filter must be able to run the job it filters.
          if git diff --name-only "$BASE" "$HEAD" -- web/ contracts/ .github/workflows/ci.yml | grep -q .; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No changes under web/ or contracts/ -- skipping typecheck/lint/build."
          fi

      - name: Set up Node
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.relevant == 'true'
        run: npm ci
        working-directory: web

      - name: Typecheck
        if: steps.changes.outputs.relevant == 'true'
        run: npm run typecheck
        working-directory: web

      - name: Lint (oxlint)
        if: steps.changes.outputs.relevant == 'true'
        run: npm run lint
        working-directory: web

      # §12.1: "no hand-written response types anywhere" -- see
      # web/scripts/check-no-dto-redeclaration.mjs's own top comment for
      # what this catches and why a name-collision check, not a
      # field-shape comparison.
      - name: Check no hand-written DTO types
        if: steps.changes.outputs.relevant == 'true'
        run: npm run check-dto-types
        working-directory: web

      # §12.1's own data layer (Step 80: "WS transport -> event log ->
      # reducer -> query invalidation") -- typechecks web/src/**/__tests__
      # then runs the real pipeline tests (vitest), which drive the real
      # transport/reducer against a real local fake WS server. See web/
      # README.md's own "Testing" section.
      - name: Test
        if: steps.changes.outputs.relevant == 'true'
        run: npm test
        working-directory: web

      - name: Build
        if: steps.changes.outputs.relevant == 'true'
        run: npm run build
        working-directory: web
