# docker-compose.dev.yml is a LOCAL DEV convenience only (used by `make
# dev`), distinct from the self-host production story (README/§12.1:
# "one binary + Postgres") — this file just brings up a throwaway Postgres
# quickly for iterating on `narvi serve` locally; it is never deployed.
services:
  postgres:
    image: postgres:17-alpine # same image the Step 04 testcontainers integration test uses, for consistency
    environment:
      POSTGRES_USER: narvi
      POSTGRES_PASSWORD: narvi
      POSTGRES_DB: narvi
    # Override the published port per worktree by dropping an untracked .env
    # file (Compose auto-loads it for variable substitution even when -f is
    # passed explicitly) containing NARVI_DEV_PG_PORT=<port>.
    ports:
      - "127.0.0.1:${NARVI_DEV_PG_PORT:-5432}:5432"
    volumes:
      - narvi-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U narvi -d narvi"]
      interval: 2s
      timeout: 5s
      retries: 30

  # minio is §28's own dev-loop story for object storage (§28.7:
  # "docker-compose.dev.yml gains a MinIO service for `make dev`") -- the
  # S3-compatible backend internal/adapters/outbound/objstore talks to in
  # development, mirroring the postgres service above exactly (same
  # override-via-.env port convention, same CMD-SHELL healthcheck shape).
  # Pulled from quay.io, MinIO's own registry, NOT Docker Hub. The comment
  # here used to note that minio/minio's Docker Hub publishing "appears to
  # have gone quiet after this exact release" -- it has since stopped
  # answering anonymous pulls entirely ("repository does not exist or may
  # require 'docker login'"), which broke CI and every local
  # `docker compose up` alike. quay.io serves the SAME pinned tag, so the
  # only thing that changed is where it comes from.
  #
  # Same tag internal/adapters/outbound/objstore/
  # objstore_integration_test.go's own testcontainer uses, for the same
  # consistency reason the postgres service's own image comment above
  # already gives. Deliberately not ":latest", so a local
  # `docker compose pull` can't silently change dev's behavior out from
  # under anyone.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: narvi
      MINIO_ROOT_PASSWORD: narvi-dev-secret
    # Override the published ports per worktree the same way NARVI_DEV_PG_PORT
    # does above, via an untracked .env file (NARVI_DEV_MINIO_PORT /
    # NARVI_DEV_MINIO_CONSOLE_PORT). 9000 is the S3 API; 9001 is the web
    # console.
    ports:
      - "127.0.0.1:${NARVI_DEV_MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${NARVI_DEV_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - narvi-dev-minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 30

  # minio-init is a one-shot bucket-provisioning step. MinIO itself boots
  # with zero buckets, and BlobStore deliberately has no bucket-management
  # method of its own (§28.1 -- provisioning a bucket is a deployment
  # concern, never the adapter's job): without this, `make dev` would hand
  # you a running, empty MinIO, and every presigned PUT/GET against the
  # configured bucket would 404 until someone created it by hand. Runs
  # once, against the SAME root credentials the minio service above was
  # given, then exits -- depends_on's service_healthy condition (not just
  # "started") ensures minio's own health check, not merely its process
  # starting, has already passed before this runs. The bucket name
  # (narvi-dev-uploads) matches the Makefile's own `dev` target's
  # NARVI_OBJECT_STORE_BUCKET value exactly -- a mismatch here would only
  # surface once someone actually ran `make dev` and tried to upload
  # something.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    # mc's own image entrypoint is ["mc"] -- overridden here so `command`
    # below can chain two mc invocations (alias set, then bucket create)
    # through a real shell instead of being passed as literal arguments to
    # a single mc call. `command` MUST be a one-element YAML list, not a
    # bare scalar string: Compose word-splits a scalar `command` string
    # into a separate exec-argv element per word (like Dockerfile CMD's
    # own shell-form-to-exec-form conversion) -- confirmed directly, this
    # silently truncated the whole script at "&&" and ran a bare, argless
    # `mc` (its own usage/help text) instead. Wrapping the full script as
    # the single list element passes it to "/bin/sh -c" verbatim, with no
    # further splitting.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "mc alias set local http://minio:9000 narvi narvi-dev-secret && mc mb --ignore-existing local/narvi-dev-uploads"

volumes:
  narvi-dev-postgres:
  narvi-dev-minio:
