# docker-compose.dev.yml is a LOCAL DEV convenience only (used by `make
# dev`), distinct from the self-host production story (README/§12.1:
# "one binary + Postgres") — this file just brings up a throwaway Postgres
# quickly for iterating on `narvi serve` locally; it is never deployed.
services:
  postgres:
    image: postgres:17-alpine # same image the Step 04 testcontainers integration test uses, for consistency
    environment:
      POSTGRES_USER: narvi
      POSTGRES_PASSWORD: narvi
      POSTGRES_DB: narvi
    # Override the published port per worktree by dropping an untracked .env
    # file (Compose auto-loads it for variable substitution even when -f is
    # passed explicitly) containing NARVI_DEV_PG_PORT=<port>.
    ports:
      - "127.0.0.1:${NARVI_DEV_PG_PORT:-5432}:5432"
    volumes:
      - narvi-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U narvi -d narvi"]
      interval: 2s
      timeout: 5s
      retries: 30

  # objectstore is §28's own dev-loop story for object storage (§28.7:
  # "docker-compose.dev.yml gains a MinIO service for `make dev`") -- the
  # S3-compatible backend internal/adapters/outbound/objstore talks to in
  # development, mirroring the postgres service above (same
  # override-via-.env port convention, same CMD-SHELL healthcheck shape).
  #
  # This was MinIO through RELEASE.2025-09-07T16-13-09Z, pulled from
  # quay.io after Docker Hub's minio/minio first went quiet. Both
  # registries have since stopped answering ANY anonymous pull at all
  # ("unauthorized" / "pull access denied ... repository does not exist
  # or may require 'docker login'"), reproduced directly against this
  # exact pinned tag from a developer machine -- not a rate limit, not
  # transient, and it broke CI and every local `docker compose up` alike.
  #
  # Replaced with versity/versitygw (Apache-2.0,
  # github.com/versity/versitygw), a purpose-built S3-protocol gateway,
  # after four MinIO-replacement candidates were run for real against
  # internal/adapters/outbound/objstore's own integration test using the
  # actual production SDK code -- see that test's own s3GatewayImage doc
  # comment for the full candidate comparison (rustfs, seaweedfs, and
  # adobe/s3mock were also tried; versitygw won on maturity, image size,
  # startup time, and being the only candidate besides seaweedfs that
  # actually enforces SigV4 signatures). Same image, same pinned tag AND
  # digest that package's own testcontainer uses, for the same consistency
  # reason the postgres service's own image comment above already gives.
  # Deliberately not ":latest", so a local `docker compose pull` can't
  # silently change dev's behavior out from under anyone.
  #
  # versitygw's own posix backend needs zero separate provisioning: unlike
  # MinIO (which booted with zero buckets and needed a whole separate
  # minio-init service running `mc mb`), the posix backend treats every
  # SUBdirectory of its top-level directory as a bucket (its own --help:
  # "All sub directories of the top level directory are treated as
  # buckets") -- so `mkdir -p /data/narvi-dev-uploads` before starting the
  # binary is the entire bucket-provisioning story, folded into this one
  # service. The bucket name (narvi-dev-uploads) matches the Makefile's
  # own `dev` target's NARVI_OBJECT_STORE_BUCKET value exactly -- a
  # mismatch here would only surface once someone actually ran `make dev`
  # and tried to upload something. `command` MUST be a one-element YAML
  # list, not a bare scalar string -- see the old minio-init service's own
  # (now-removed) comment on why: Compose word-splits a scalar `command`
  # string into a separate exec-argv element per word, silently truncating
  # at "&&".
  #
  # No web-console equivalent is published (MinIO's old 9001) -- nothing
  # in this repo depends on it; use versitygw's own --webui flag locally
  # if you want one.
  objectstore:
    image: versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
    entrypoint: ["sh", "-c"]
    command:
      - "mkdir -p /data/narvi-dev-uploads && exec /usr/local/bin/versitygw --health /healthz posix /data"
    environment:
      ROOT_ACCESS_KEY: narvi
      ROOT_SECRET_KEY: narvi-dev-secret
    # Override the published port per worktree the same way NARVI_DEV_PG_PORT
    # does above, via an untracked .env file (NARVI_DEV_OBJSTORE_PORT).
    ports:
      - "127.0.0.1:${NARVI_DEV_OBJSTORE_PORT:-9000}:7070"
    volumes:
      - narvi-dev-objectstore:/data
    healthcheck:
      # --health above configures an unauthenticated GET /healthz
      # (verified directly against this pinned image); wget, not curl,
      # since that's what this image's own alpine/busybox base actually
      # ships (confirmed directly -- no curl binary present).
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7070/healthz"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  narvi-dev-postgres:
  narvi-dev-objectstore:
