# deploy/control-plane/secret.yaml is a TEMPLATE, not something to
# `kubectl apply` verbatim: every value below is a placeholder an operator
# must replace with a real credential before deploying (§41.1,
# docs/TECHNICAL_PLAN.md's own "no Helm chart, deliberately" decision --
# platform.Config's own boot-time validation, internal/platform/config.go,
# is the single configuration surface this repository has; a chart would
# be a second one, with its own defaults, drifting independently of it).
#
# Every key below is either unconditionally required by platform.Load, or
# required once the feature/surface it belongs to is turned on -- see each
# group's own comment. internal/ops/deploysecret_test.go
# (TestDeploySecretTemplate) is the drift guard: it parses
# internal/platform/config.go's own source for every env var that can
# trip Load's "missing" validation and fails this repository's test suite
# if this file ever stops naming one of them, or starts naming a
# NARVI_-prefixed key config.go no longer reads at all. That test is what
# keeps this comment (and this file) honest as config.go changes --
# never re-derive this list by hand from memory.
apiVersion: v1
kind: Secret
metadata:
  name: narvi-control-plane
type: Opaque
stringData:
  # --- Core boot config (unconditionally required) ---
  NARVI_STAGE: "production" # one of development, staging, production
  NARVI_DATABASE_URL: "postgres://REPLACE_ME_USER:REPLACE_ME_PASSWORD@REPLACE_ME_HOST:5432/narvi?sslmode=require"
  NARVI_PUBLIC_BASE_URL: "https://REPLACE_ME.example.com"
  NARVI_TOKEN_ENCRYPTION_KEY: "REPLACE_ME_BASE64_32_BYTES" # base64 of exactly 32 random bytes

  # --- Per-direction HMAC secrets (§5.2: one rotation must never touch
  # every direction at once) ---
  NARVI_HMAC_SANDBOX_SECRET: "REPLACE_ME"
  NARVI_HMAC_BOTS_SECRET: "REPLACE_ME"
  NARVI_HMAC_WEBHOOK_SECRET: "REPLACE_ME"

  # --- Sign-in allowlist (§13.1): at least ONE of these three must be
  # non-empty -- Load refuses to boot with all three empty, but never
  # names one individually, so this template sets one and leaves the
  # other two blank as the documented "unused" shape. ---
  NARVI_ALLOWED_EMAIL_DOMAINS: "example.com"
  NARVI_ALLOWED_GITHUB_ORGS: ""
  NARVI_ALLOWED_EMAILS: ""

  # --- GitHub OAuth sign-in (§13.1) ---
  NARVI_GITHUB_CLIENT_ID: "REPLACE_ME"
  NARVI_GITHUB_CLIENT_SECRET: "REPLACE_ME"

  # --- GitHub ingress (§8.2): webhook signature + mention-detection bot
  # handle + the bot credential outbound comments are posted with.
  # Required whenever NARVI_INGRESS_ENABLED includes "github" -- which it
  # does by default when that variable is left unset (§12.5), the
  # deployment shape this template assumes. ---
  NARVI_GITHUB_WEBHOOK_SECRET: "REPLACE_ME"
  NARVI_GITHUB_BOT_HANDLE: "REPLACE_ME_bot_handle"
  NARVI_GITHUB_BOT_TOKEN: "REPLACE_ME"

  # --- GitHub App (§30.4): required in every stage, independent of
  # NARVI_INGRESS_ENABLED -- backs the shadow-sandbox scope check that
  # runs at boot before this process serves any traffic. ---
  NARVI_GITHUB_APP_ID: "REPLACE_ME_numeric_app_id"
  NARVI_GITHUB_APP_PRIVATE_KEY: "REPLACE_ME_base64_PEM"

  # --- GitHub API base URL: OPTIONAL, defaults to https://api.github.com
  # when left blank. NOT a GitHub Enterprise Server setting (§41.1 review
  # round 2, findings Q2/Q11) -- it feeds ONLY the GitHub App client, never
  # OAuth login or any user-token API call, and platform.Load refuses to
  # boot if it is set to anything non-empty outside NARVI_STAGE=development
  # (InvalidGitHubAPIBaseURLError). It exists solely for this repository's
  # own verify-control-plane-image target (Makefile), which points the
  # packaged image's GitHub App client at a local stub. Deliberately left
  # UNSET (commented out) in this PRODUCTION template -- setting it here
  # would be a boot-time validation error, not a working override:
  # NARVI_GITHUB_API_BASE_URL: "" # development-stage-only; do not set in production

  # --- Modal sandbox provider (§4.1.1: the only sandbox provider a public
  # boot can select today) ---
  NARVI_MODAL_BASE_URL: "https://REPLACE_ME.modal.example.com"
  NARVI_MODAL_AUTH_TOKEN: "REPLACE_ME"

  # --- Linear ingress: required whenever NARVI_INGRESS_ENABLED includes
  # "linear" (default-on, §12.5) ---
  NARVI_LINEAR_WEBHOOK_SECRET: "REPLACE_ME"
  NARVI_LINEAR_CLIENT_ID: "REPLACE_ME"
  NARVI_LINEAR_CLIENT_SECRET: "REPLACE_ME"
  NARVI_LINEAR_DEFAULT_REPO_NAME: "REPLACE_ME_org/repo"
  NARVI_LINEAR_DEFAULT_REPO_URL: "https://github.com/REPLACE_ME/REPLACE_ME"

  # --- Slack ingress: required whenever NARVI_INGRESS_ENABLED includes
  # "slack" (default-on, §12.5) ---
  NARVI_SLACK_SIGNING_SECRET: "REPLACE_ME"
  NARVI_SLACK_BOT_TOKEN: "REPLACE_ME"

  # --- Intent classifier (§1's own model-provider choice) ---
  NARVI_ANTHROPIC_API_KEY: "REPLACE_ME"
  NARVI_INTENT_CLASSIFIER_PROVIDER: "anthropic"
  NARVI_INTENT_CLASSIFIER_MODEL: "claude-haiku-4-5"

  # --- Object storage (§28.7): the whole bundle is OPTIONAL -- feature-
  # flagged on NARVI_OBJECT_STORE_ENDPOINT alone. Leave every key in this
  # group blank to run with uploads disabled, or fill in all of REGION/
  # BUCKET (both required once ENDPOINT is set) plus the credential pair
  # (required together, or not at all) for a real S3/MinIO bucket. ---
  NARVI_OBJECT_STORE_ENDPOINT: ""
  NARVI_OBJECT_STORE_REGION: ""
  NARVI_OBJECT_STORE_BUCKET: ""
  NARVI_OBJECT_STORE_ACCESS_KEY_ID: ""
  NARVI_OBJECT_STORE_SECRET_ACCESS_KEY: ""
  NARVI_OBJECT_STORE_PUBLIC_ENDPOINT: ""
  NARVI_OBJECT_STORE_USE_PATH_STYLE: "false"
